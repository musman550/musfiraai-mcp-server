name: CI Guard (test every push, auto-rollback on failure)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ci-guard-main
  cancel-in-progress: false

jobs:
  test-and-guard:
    runs-on: ubuntu-latest
    if: >-
      !contains(github.event.head_commit.message, 'Uptime check:') &&
      !startsWith(github.event.head_commit.author.email, 'uptime-bot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Local smoke test (server boots, docs load, MCP handshake, tool count)
        id: smoke
        run: python3 smoke_test.py

      - name: Wait for Manufact to build & deploy this commit
        if: success()
        run: sleep 120

      - name: Verify the LIVE server is healthy on this commit
        id: live_check
        if: success()
        run: |
          python3 - <<'PYEOF'
          import json, sys, time, urllib.request, urllib.error

          BASE = "https://dark-spark-uxxux.run.mcp-use.com"

          def healthy():
              common_headers = {"User-Agent": "Musfiraai-CI-Guard/1.0 (+https://github.com/musman550/musfiraai-mcp-server)"}
              try:
                  health_req = urllib.request.Request(BASE + "/health", headers=common_headers)
                  with urllib.request.urlopen(health_req, timeout=10) as r:
                      body = r.read()
                      if r.status != 200:
                          print(f"::warning::/health returned {r.status}: {body[:200]}")
                          return False
              except Exception as e:
                  print(f"::warning::/health request raised {type(e).__name__}: {e}")
                  return False
              try:
                  req = urllib.request.Request(
                      BASE + "/mcp", method="POST",
                      data=json.dumps({
                          "jsonrpc": "2.0", "id": 1, "method": "initialize",
                          "params": {"protocolVersion": "2025-03-26", "capabilities": {},
                                     "clientInfo": {"name": "ci-guard", "version": "1.0"}},
                      }).encode(),
                      headers={"Content-Type": "application/json",
                               "Accept": "application/json, text/event-stream",
                               "User-Agent": common_headers["User-Agent"]},
                  )
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read()
                      if r.status != 200:
                          print(f"::warning::/mcp initialize returned {r.status}: {body[:300]}")
                      return r.status == 200
              except urllib.error.HTTPError as e:
                  body = e.read()
                  print(f"::warning::/mcp initialize HTTPError {e.code}: {body[:300]}")
                  return False
              except Exception as e:
                  print(f"::warning::/mcp initialize raised {type(e).__name__}: {e}")
                  return False

          for attempt in range(6):
              try:
                  if healthy():
                      print("Live server healthy.")
                      sys.exit(0)
              except Exception as e:
                  print(f"::warning::check attempt {attempt+1} outer error: {type(e).__name__}: {e}")
              time.sleep(20)
          print("::error::Live server NOT healthy after retries.")
          sys.exit(1)
          PYEOF

      - name: Tag and publish a release for this verified, live commit
        if: success()
        run: |
          git fetch --tags
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            IFS='.' read -r MA MI PA <<< "${LAST_TAG#v}"
            NEW_TAG="v${MA}.${MI}.$((PA + 1))"
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          gh release create "$NEW_TAG" --generate-notes --title "$NEW_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Auto-revert this commit — smoke test or live check failed
        if: always() && (steps.smoke.outcome == 'failure' || steps.live_check.outcome == 'failure')
        run: |
          git config user.email "ci-guard-bot@musfiraai.local"
          git config user.name "Musfiraai CI Guard"
          LAST_MSG=$(git log -1 --pretty=%s)
          if [[ "$LAST_MSG" == Revert* ]]; then
            echo "::error::The last commit was already a revert and still failed — stopping instead of looping. Needs a human look."
            exit 1
          fi
          git revert --no-edit HEAD
          for i in 1 2 3; do
            git push origin main && break
            echo "Push rejected (concurrent update), rebasing and retrying ($i/3)..."
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "::warning::A broken push was detected and automatically reverted."
